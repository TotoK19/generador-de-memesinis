<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Generador de memes</title>
</head>
<body>
  <header class="header">
    <img src="../static/img/logo.svg" alt="logo" width="50" height="50">
    <ul class="main-list">
        <li class="list__item"><a href="">Página principal</a></li>
        <li class="list__item"><a href="">Colección</a></li>
        <li class="list__item"><a href="">Comentarios</a></li>
    </ul>
  </header>
  <main>
    {% block content %}
    <div class="form-block">
      <h1>¡Genera tu meme!</h1>
      <form method="POST" action="{{ url_for('index') }}">
        <ul class="form-list">
          <li class="form-list_item">
            <label for="image-selector">Selecciona un meme</label>
            <select name="image-selector" id="image-selector">
              <option value="logo.svg" {% if selected_image == 'logo.svg' %}selected{% endif %}>Selecciona un meme</option>
              <option value="meme_1.jpg" {% if selected_image == 'meme_1.jpg' %}selected{% endif %}>Chica desastre</option>
              <option value="meme_2.jpg" {% if selected_image == 'meme_2.jpg' %}selected{% endif %}>Dos botones</option>
              <option value="meme_3.jpg" {% if selected_image == 'meme_3.jpg' %}selected{% endif %}>Davo dice obviedad</option>
              <option value="meme_4.jpg" {% if selected_image == 'meme_4.jpg' %}selected{% endif %}>Speed trata no reirse</option>
              <option value="meme_5.jfif" {% if selected_image == 'meme_5.jfif' %}selected{% endif %}>Son</option>
              <option value="meme_6.jpg" {% if selected_image == 'meme_6.jpg' %}selected{% endif %}>Tortuga sorprendida</option>
              <option value="meme_7.jpg" {% if selected_image == 'meme_7.jpg' %}selected{% endif %}>Hulk llora</option>
            </select>
          </li>
          <li class="form-list_item">
            <label for="text_top">Escriba aquí el texto principal</label>
            <input class="input_text" type="text" placeholder="Top text" name="text_top" value="{{ text_top }}">
          </li>
          <li class="form-list_item">
            <label for="text_bottom">Introduzca aquí el texto inferior</label>
            <input class="input_text" type="text" placeholder="Bottom text" name="text_bottom" value="{{ text_bottom }}">
          </li>
          <li class="form-list_item">
            <label for="color-selector">Definir el color del texto</label>
            <select name="color-selector" id="color-selector">
              <option value="white" {% if selected_color == 'white' %}selected{% endif %}>Blanco</option>
              <option value="black" {% if selected_color == 'black' %}selected{% endif %}>Negro</option>
              <option value="red" {% if selected_color == 'red' %}selected{% endif %}>Rojo</option>
            </select>
          </li>
          <li class="form-list_item">
            <label for="text_top_y">Introduzca la posición del texto superior en el eje Y (ej: 10% o 50px)</label>
            <input class="input_text" id="text_top_y" type="text" placeholder="20%" name="text_top_y" value="{{ text_top_y }}">
          </li>
          <li class="form-list_item">
            <label for="text_bottom_y">Introducir la posición del texto inferior en el eje Y (ej: 80% o 400px)</label>
            <input class="input_text" id="text_bottom_y" type="text" placeholder="80%" name="text_bottom_y" value="{{ text_bottom_y }}">
          </li>
          <button type="submit">Genera tu meme</button>
        </ul>
      </form>
    </div>
    
    <div class="meme-block" id="memeBlock">
      <!-- CORREGIDO: Se inyectan las variables de posición y color dinámicamente en el CSS en línea -->
      <p class="text_top" style="top: {{ text_top_y }}; color: {{ selected_color }};">
        {{ text_top }}
      </p>

      <img class="meme" src="{{ url_for('serve_images', path=selected_image) }}" alt="{{ selected_image }}">

      <p class="text_bottom" style="top: {{ text_bottom_y }}; color: {{ selected_color }};">
        {{ text_bottom }}
      </p>
    </div>
    {% endblock %}
  </main>
  <footer></footer>
</body>
</html>
